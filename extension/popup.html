<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KREDO</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 320px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #1a1a1a;
            color: #e5e5e5;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .header-icon {
            font-size: 18px;
        }

        .header h1 {
            font-size: 14px;
            font-weight: 600;
            color: #d4d4d4;
            letter-spacing: -0.01em;
        }

        .hidden {
            display: none !important;
        }

        /* ── Initial State ─────────────────── */
        #not-article p {
            color: #a3a3a3;
            font-size: 13px;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .page-url {
            font-size: 11px;
            color: #737373;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            word-break: break-all;
            line-height: 1.4;
            max-height: 40px;
            overflow: hidden;
        }

        #analyze-btn {
            width: 100%;
            padding: 10px 16px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s, transform 0.1s;
        }

        #analyze-btn:hover {
            background: #1d4ed8;
        }

        #analyze-btn:active {
            transform: scale(0.98);
        }

        /* ── Loading / Pipeline Progress ──── */
        .pipeline-progress {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .pipeline-step {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 12px;
            line-height: 1.5;
            animation: stepIn 0.3s ease-out both;
        }

        @keyframes stepIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .step-indicator {
            flex-shrink: 0;
            width: 16px;
            text-align: center;
            margin-top: 1px;
        }

        .step-active .step-indicator {
            animation: pulse 1.2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }
        }

        .step-done {
            color: #4ade80;
        }

        .step-active {
            color: #60a5fa;
        }

        .step-pending {
            color: #525252;
        }

        .pipeline-eta {
            margin-top: 10px;
            font-size: 11px;
            color: #525252;
            text-align: center;
        }

        /* ── Result Verdict ─────────────── */
        .verdict {
            border-radius: 10px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: stepIn 0.4s ease-out both;
        }

        .verdict-fake {
            border-color: rgba(252, 165, 165, 0.4);
        }

        .verdict-real {
            border-color: rgba(74, 222, 128, 0.4);
        }

        .verdict-misleading {
            border-color: rgba(252, 211, 77, 0.4);
        }

        .verdict-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .verdict h2 {
            font-size: 15px;
            font-weight: 600;
            margin: 0;
        }

        .verdict-fake h2 {
            color: #fca5a5;
        }

        .verdict-real h2 {
            color: #4ade80;
        }

        .verdict-misleading h2 {
            color: #fcd34d;
        }

        .score-badge {
            font-size: 13px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
        }

        .verdict-fake .score-badge {
            color: #fca5a5;
        }

        .verdict-real .score-badge {
            color: #4ade80;
        }

        .verdict-misleading .score-badge {
            color: #fcd34d;
        }

        .verdict p {
            font-size: 12px;
            color: #a3a3a3;
            margin: 6px 0 0;
            line-height: 1.5;
        }

        #view-details {
            width: 100%;
            margin-top: 12px;
            padding: 8px 14px;
            background: transparent;
            color: #93c5fd;
            border: 1px solid rgba(147, 197, 253, 0.2);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }

        #view-details:hover {
            background: rgba(147, 197, 253, 0.08);
        }

        /* ── Error State ──────────────── */
        .error-msg {
            font-size: 12px;
            color: #fca5a5;
            background: rgba(252, 165, 165, 0.08);
            border: 1px solid rgba(252, 165, 165, 0.15);
            border-radius: 8px;
            padding: 10px 12px;
            line-height: 1.5;
            animation: stepIn 0.3s ease-out both;
        }

        .retry-btn {
            margin-top: 10px;
            width: 100%;
            padding: 8px;
            background: #2f2f2f;
            color: #e5e5e5;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="popup-container">
        <div class="header">
            <span class="header-icon">🔍</span>
            <h1>KREDO</h1>
        </div>

        <!-- Initial state -->
        <div id="not-article">
            <p>Scan this page with our Multi-agent AI pipeline to check for misinformation.</p>
            <div id="current-url" class="page-url"></div>
            <button id="analyze-btn" style="margin-bottom: 12px;">Analyze This Page</button>

            <div style="position: relative; margin-top: 12px; margin-bottom: 12px;">
                <div style="position: absolute; top: -8px; left: 0; width: 100%; border-top: 1px solid rgba(255, 255, 255, 0.1); text-align: center;">
                    <span style="background: #1a1a1a; padding: 0 10px; color: #737373; font-size: 11px;">OR</span>
                </div>
            </div>

            <input type="text" id="query-input" placeholder="Paste URL or enter text..." style="width: 100%; padding: 10px 12px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #fff; font-size: 13px; margin-bottom: 8px; outline: none; transition: border-color 0.2s;" />
            <button id="analyze-query-btn" style="width: 100%; padding: 10px 16px; background: #3f3f46; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; transition: background 0.2s, transform 0.1s;">Analyze Input</button>
        </div>

        <!-- Loading / Pipeline progress -->
        <div id="loading" class="hidden">
            <div class="pipeline-progress" id="pipeline-steps"></div>
            <div class="pipeline-eta" id="pipeline-eta">This usually takes 20-40 seconds</div>
        </div>

        <!-- Result -->
        <div id="result" class="hidden">
            <div id="verdict-container" class="verdict">
                <div class="verdict-top">
                    <h2 id="verdict-text"></h2>
                    <span id="score-badge" class="score-badge"></span>
                </div>
                <p id="verdict-description"></p>
                <button id="view-details">View Deep Analysis →</button>
            </div>
        </div>

        <!-- Error -->
        <div id="error-state" class="hidden">
            <div class="error-msg" id="error-msg"></div>
            <button class="retry-btn" id="retry-btn">Try Again</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
